<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página Movida</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #f0f4f8;
      font-family: Arial, sans-serif;
    }

    .card {
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      padding: 60px 50px;
      max-width: 700px;
      width: 90%;
      text-align: center;
    }

    .icone {
      font-size: 48px;
      margin-bottom: 24px;
    }

    h1 {
      font-size: 22px;
      color: #444444;
      margin-bottom: 32px;
      line-height: 1.5;
    }

    a {
      display: inline-block;
      font-size: 18px;
      color: #ffffff;
      background-color: #006BA6;
      text-decoration: none;
      padding: 16px 32px;
      border-radius: 8px;
      font-weight: bold;
      transition: background-color 0.2s;
    }

    a:hover {
      background-color: #00527d;
    }

    .url-texto {
      margin-top: 20px;
      font-size: 13px;
      color: #888888;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icone">📋</div>
    <h1>Esta página foi movida para um novo endereço.</h1>
    <a href="https://wemersonjco.github.io/SCC/aih_sistema.html" target="_blank">
      Clique aqui para acessar o novo endereço
    </a>
    <p class="url-texto">https://wemersonjco.github.io/SCC/aih_sistema.html</p>
  </div>
</body>
</html>
